<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BLOB · HYPE LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#00ff88; --g2:#00cc66; --g3:#00ff44;
  --bg:#020508; --sub:rgba(255,255,255,0.38); --text:#f0faf4;
  --glass:rgba(3,10,6,0.55); --border:rgba(0,255,136,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}

/* ─── BG ─── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.cursor-glow{position:fixed;width:280px;height:280px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(0,255,136,0.028) 0%,transparent 70%);
  transform:translate(-50%,-50%);transition:left .07s,top .07s;will-change:left,top}

/* ─── APP ─── */
#app{position:relative;z-index:10;height:100dvh;width:100%;max-width:430px;
  margin:0 auto;display:flex;flex-direction:column;align-items:center;overflow:hidden}

/* ─── HEADER ─── */
header{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 0;flex-shrink:0;z-index:40}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:12px;letter-spacing:3.5px;
  background:linear-gradient(90deg,var(--g1),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hstatus{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:7px;color:var(--sub)}
.ldot{width:4px;height:4px;border-radius:50%;background:var(--g1);box-shadow:0 0 7px var(--g1);animation:ldot 2s infinite}
@keyframes ldot{0%,100%{opacity:1}50%{opacity:.2}}

/* ════════════════════════════════
   ZONA DO BLOB
════════════════════════════════ */
#blob-stage{
  position:relative;flex:1;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}

/* FUMAÇA */
#smoke-wrap{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);
  width:260px;height:240px;pointer-events:none;z-index:2}
.sp{position:absolute;border-radius:50%;filter:blur(20px);animation:smokeUp linear infinite;will-change:transform,opacity}
@keyframes smokeUp{
  0%{transform:translateY(0) scale(.35) rotate(0deg);opacity:.5}
  45%{opacity:.28}85%{opacity:.07}
  100%{transform:translateY(-170px) scale(2) rotate(var(--r));opacity:0}
}

/* AURAS */
.aura{position:absolute;border-radius:50%;border:1px solid rgba(0,255,136,.06);
  animation:auraOut 3.5s ease-out infinite;pointer-events:none}
.aura:nth-child(1){width:170px;height:170px;animation-delay:0s}
.aura:nth-child(2){width:220px;height:220px;animation-delay:1.1s}
.aura:nth-child(3){width:270px;height:270px;animation-delay:2.2s}
@keyframes auraOut{0%{opacity:.5;transform:scale(.82)}70%{opacity:.08}100%{opacity:0;transform:scale(1.08)}}

/* GLOW CHÃO */
.blob-ground{position:absolute;width:130px;height:35px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,255,136,.18) 0%,transparent 70%);
  bottom:calc(30% - 30px);filter:blur(6px);animation:groundGlow 2.5s ease-in-out infinite}
@keyframes groundGlow{0%,100%{opacity:.8;transform:scaleX(1)}50%{opacity:.35;transform:scaleX(.75)}}

/* ANÉIS LOADER */
.lring{position:absolute;border-radius:50%;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.lring-1{width:145px;height:145px;border:1.5px solid transparent;
  border-top:1.5px solid var(--g1);border-right:1.5px solid rgba(0,255,136,.25);z-index:6}
.lring-2{width:130px;height:130px;border:1px solid transparent;
  border-bottom:1px solid rgba(0,255,136,.2);z-index:6}
.lring-3{width:160px;height:160px;border:.5px solid transparent;
  border-left:.5px solid rgba(0,255,136,.12);z-index:6}
body.state-loading .lring{opacity:1}
body.state-loading .lring-1{animation:rot1 .65s linear infinite}
body.state-loading .lring-2{animation:rot2 1.1s linear infinite}
body.state-loading .lring-3{animation:rot3 1.8s linear infinite}
@keyframes rot1{to{transform:rotate(360deg)}}
@keyframes rot2{to{transform:rotate(-360deg)}}
@keyframes rot3{to{transform:rotate(360deg)}}

/* BLOB BODY */
.blob-wrap{position:relative;width:118px;height:118px;z-index:5;
  display:flex;align-items:center;justify-content:center;}
body.state-idle .blob-wrap{animation:bfloat 3.2s ease-in-out infinite}
body.state-happy .blob-wrap{animation:bjump .5s ease-out 1}
body.state-alert .blob-wrap{animation:bshake .4s ease-in-out 1}
body.state-thinking .blob-wrap{animation:bthink 1.8s ease-in-out infinite}
body.state-love .blob-wrap{animation:bjump .6s ease-out 1}
body.state-confused .blob-wrap{animation:btilt 1s ease-in-out 2}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bjump{0%,100%{transform:translateY(0)}35%{transform:translateY(-18px) scale(1.05)}}
@keyframes bshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes bthink{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes btilt{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

.blob-body{
  width:112px;height:112px;border-radius:50%;position:relative;cursor:pointer;
  background:radial-gradient(circle at 38% 32%,#1e2e22 0%,#081408 45%,#020804 100%);
  border:1px solid rgba(0,255,136,.09);
  box-shadow:0 22px 55px rgba(0,0,0,.92),inset 0 -4px 10px rgba(0,0,0,.8),
    inset 0 3px 10px rgba(0,255,136,.04),0 0 0 1px rgba(0,255,136,.03);
  display:flex;align-items:center;justify-content:center;
  transition:box-shadow .4s ease;will-change:transform;
}
.blob-body::before{content:'';position:absolute;top:14px;left:18px;width:26px;height:12px;
  border-radius:50%;background:radial-gradient(circle,rgba(0,255,136,.1),transparent);transform:rotate(-20deg)}
body.state-happy .blob-body{box-shadow:0 22px 55px rgba(0,0,0,.9),0 0 35px rgba(0,255,136,.2),inset 0 3px 10px rgba(0,255,136,.1)}
body.state-alert .blob-body{box-shadow:0 22px 55px rgba(0,0,0,.9),0 0 25px rgba(255,120,0,.15)}
body.state-love .blob-body{box-shadow:0 22px 55px rgba(0,0,0,.9),0 0 35px rgba(255,80,120,.15)}

/* OLHOS */
.blob-eyes{display:flex;gap:20px;align-items:center;position:relative;z-index:10;
  transition:transform .1s ease-out;will-change:transform}
.eye{width:11px;height:18px;background:var(--g1);border-radius:100px;
  box-shadow:0 0 12px var(--g1),0 0 22px rgba(0,255,136,.3);
  transition:all .15s ease;transform-origin:center;will-change:transform}
body.state-loading .eye{transform:scaleY(.08)!important}
body.state-happy .eye{animation:eyeHappy .5s ease-out 1}
@keyframes eyeHappy{0%,100%{border-radius:100px}40%,70%{border-radius:100px 100px 4px 4px;transform:scaleY(.6)}}
body.state-alert .eye{background:#ff8800!important;box-shadow:0 0 14px #ff8800!important;animation:eyeAlert .3s ease-in-out 3}
@keyframes eyeAlert{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
body.state-love .eye{background:#ff6688!important;box-shadow:0 0 14px #ff6688!important}
body.state-confused .eye{transform:scaleY(.7) translateY(2px)!important}
body.state-thinking .eye{animation:eyeThink 1.5s ease-in-out infinite}
@keyframes eyeThink{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.eye.blink{transform:scaleY(.04)!important}

/* MOOD BADGE */
.blob-label{position:absolute;bottom:calc(30% - 68px);display:flex;flex-direction:column;
  align-items:center;gap:3px;z-index:10}
.blob-name{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:2px;color:#fff}
.blob-sub{font-family:'Space Mono',monospace;font-size:6.5px;color:var(--sub);letter-spacing:1px}
.mood-pill{font-family:'Space Mono',monospace;font-size:6.5px;color:var(--g1);
  background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.15);
  border-radius:20px;padding:2px 9px;letter-spacing:1px;transition:all .35s ease;min-width:90px;text-align:center}

/* ════════════════════════════════
   CHAT OVERLAY
════════════════════════════════ */
#chat-layer{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;
  pointer-events:none;
}

/* MENSAGENS — scrollable */
#messages-wrap{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:70px 14px 12px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:10px;
  scroll-behavior:smooth;pointer-events:auto;
  mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 100%);
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 100%);
}
#messages-wrap::-webkit-scrollbar{width:2px}
#messages-wrap::-webkit-scrollbar-thumb{background:rgba(0,255,136,.12);border-radius:2px}

/* FIX SCROLL — quando há muito conteúdo, o flex deve crescer pra cima */
#messages-wrap.has-overflow{justify-content:flex-start}

.msg-row{display:flex;align-items:flex-end;gap:8px;animation:msgIn .38s cubic-bezier(.16,1,.3,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse}

/* AVATAR MINIATURA */
.mini-blob{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 38% 32%,#1e2e22 0%,#081408 50%,#020804 100%);
  border:1px solid rgba(0,255,136,.15);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 10px rgba(0,255,136,.1);
  position:relative;overflow:hidden;
}
.mini-eyes{display:flex;gap:5px}
.mini-eye{width:3px;height:5px;background:var(--g1);border-radius:10px;box-shadow:0 0 4px var(--g1)}
.mini-blob.happy .mini-eye{animation:miniHappy .5s ease-out 1}
@keyframes miniHappy{0%,100%{border-radius:10px}50%{border-radius:10px 10px 2px 2px;transform:scaleY(.6)}}
.mini-blob.alert .mini-eye{background:#ff8800;box-shadow:0 0 4px #ff8800}
.mini-blob.love .mini-eye{background:#ff6688;box-shadow:0 0 4px #ff6688}
.mini-blob.confused .mini-eye{transform:scaleY(.6)}

/* BUBBLE */
.bubble{
  max-width:78%;padding:11px 14px;border-radius:16px;
  font-size:13px;line-height:1.6;position:relative;
}
.msg-row.blob .bubble{
  background:rgba(0,255,136,0.045);
  border:1px solid rgba(0,255,136,.1);
  border-bottom-left-radius:4px;color:var(--text);
  backdrop-filter:blur(12px);
}
.msg-row.blob .bubble strong{color:var(--g1)}
.msg-row.blob .bubble a{color:var(--g1);text-decoration:underline}
.msg-row.user .bubble{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-bottom-right-radius:4px;color:#ddd;backdrop-filter:blur(12px);
}

/* TYPING */
.typing-bub{display:flex;gap:5px;padding:12px 16px;
  background:rgba(0,255,136,.04);border:1px solid rgba(0,255,136,.08);
  border-radius:16px;border-bottom-left-radius:4px;width:fit-content;backdrop-filter:blur(12px)}
.td{width:5px;height:5px;border-radius:50%;background:var(--g1);animation:tdot 1s ease-in-out infinite}
.td:nth-child(2){animation-delay:.18s}.td:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}

/* QUICK REPLIES */
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;pointer-events:auto;}
.qr{
  background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.18);
  border-radius:20px;padding:6px 12px;font-size:11.5px;color:var(--g1);
  cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;font-weight:600;
  white-space:nowrap;
}
.qr:hover,.qr:active{background:rgba(0,255,136,.14);transform:scale(.97)}

/* ════════════════════════════════
   POP-UP CAPTURA DE LEADS
════════════════════════════════ */
#lead-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
#lead-overlay.open{opacity:1;pointer-events:auto}

#lead-sheet{
  width:100%;max-width:430px;
  background:linear-gradient(180deg,#0a1a0e 0%,#020804 100%);
  border:1px solid rgba(0,255,136,.18);
  border-bottom:none;
  border-radius:24px 24px 0 0;
  padding:28px 24px 36px;
  transform:translateY(100%);
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
#lead-overlay.open #lead-sheet{transform:translateY(0)}

.lead-handle{width:36px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin:0 auto 20px}
.lead-title{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#fff;margin-bottom:4px}
.lead-sub{font-size:12px;color:var(--sub);margin-bottom:20px;line-height:1.5}

.lead-field{
  width:100%;background:rgba(0,0,0,.4);
  border:1px solid rgba(0,255,136,.14);
  border-radius:12px;padding:13px 16px;
  font-family:'Outfit',sans-serif;font-size:14px;
  color:#fff;outline:none;margin-bottom:10px;
  transition:border-color .2s;
}
.lead-field::placeholder{color:rgba(255,255,255,.22)}
.lead-field:focus{border-color:rgba(0,255,136,.35);background:rgba(0,255,136,.03)}

.lead-btn{
  width:100%;background:linear-gradient(135deg,var(--g1),#00a33c);
  border:none;border-radius:12px;padding:14px;margin-top:4px;
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;
  color:#001a0a;cursor:pointer;transition:all .2s;
}
.lead-btn:hover{box-shadow:0 8px 24px rgba(0,255,136,.3);transform:scale(.99)}
.lead-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.lead-skip{
  display:block;text-align:center;margin-top:12px;
  font-size:11px;color:rgba(255,255,255,.2);cursor:pointer;
  background:none;border:none;width:100%;font-family:'Outfit',sans-serif;
}
.lead-skip:hover{color:rgba(255,255,255,.4)}

/* lead status */
#lead-success{display:none;text-align:center;padding:12px 0}
#lead-success .success-icon{font-size:40px;margin-bottom:8px}
#lead-success p{font-size:14px;color:var(--g1);font-weight:600}
#lead-success small{font-size:11px;color:var(--sub)}

/* ════════════════════════════════
   INPUT — fixo na base
════════════════════════════════ */
#input-dock{
  width:100%;flex-shrink:0;padding:8px 14px 14px;
  background:linear-gradient(to top,rgba(2,5,8,.98) 70%,transparent);
  z-index:30;pointer-events:auto;position:relative;
}
.input-row{display:flex;gap:8px;align-items:flex-end}
#chat-input{
  flex:1;background:rgba(0,255,136,.04);border:1px solid rgba(0,255,136,.12);
  border-radius:14px;padding:11px 14px;font-family:'Outfit',sans-serif;font-size:13.5px;
  color:#fff;outline:none;resize:none;line-height:1.4;max-height:90px;overflow-y:auto;
}
#chat-input::placeholder{color:rgba(255,255,255,.22)}
#chat-input:focus{border-color:rgba(0,255,136,.28);background:rgba(0,255,136,.06)}
#send-btn{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;cursor:pointer;border:none;
  background:linear-gradient(135deg,var(--g1),var(--g2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,255,136,.2);transition:all .2s
}
#send-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(0,255,136,.35)}
#send-btn:disabled{opacity:.4;transform:none}
#send-btn svg{width:14px;height:14px;fill:#001a0a}

/* FOOTER */
footer{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:4px 20px 10px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.01);z-index:30}
.footer-brand{font-family:'Space Mono',monospace;font-size:6px;color:rgba(255,255,255,.05)}
.reset-btn{font-family:'Space Mono',monospace;font-size:6px;color:rgba(255,255,255,.1);cursor:pointer;background:none;border:none;}
</style>
</head>
<body class="state-idle">

<canvas id="bg-canvas"></canvas>
<div class="cursor-glow" id="cg"></div>

<!-- POP-UP LEAD -->
<div id="lead-overlay">
  <div id="lead-sheet">
    <div class="lead-handle"></div>
    <div id="lead-form-wrap">
      <div class="lead-title">Vamos conversar! 🟢</div>
      <div class="lead-sub">Deixa seus dados e nossa equipe entra em contato pra montar a proposta ideal pra você.</div>
      <input class="lead-field" id="lf-name" placeholder="Seu nome" type="text" autocomplete="name"/>
      <input class="lead-field" id="lf-email" placeholder="Seu e-mail" type="email" autocomplete="email"/>
      <input class="lead-field" id="lf-phone" placeholder="WhatsApp (opcional)" type="tel" autocomplete="tel"/>
      <button class="lead-btn" id="lead-submit-btn" onclick="submitLead()">✓ Quero ser contactado</button>
      <button class="lead-skip" onclick="closeLead()">Agora não, obrigado</button>
    </div>
    <div id="lead-success">
      <div class="success-icon">🎉</div>
      <p>Dados enviados com sucesso!</p>
      <small>Nossa equipe entra em contato em breve.</small>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">HYPE·LAB</div>
    <div class="hstatus"><div class="ldot"></div><span id="status-txt">BLOB ATIVO</span></div>
  </header>

  <div id="blob-stage">
    <div id="smoke-wrap"></div>
    <div class="aura"></div><div class="aura"></div><div class="aura"></div>
    <div class="blob-ground"></div>

    <div class="lring lring-1" style="position:absolute"></div>
    <div class="lring lring-2" style="position:absolute"></div>
    <div class="lring lring-3" style="position:absolute"></div>

    <div class="blob-wrap" id="blob-wrap">
      <div class="blob-body" id="blob-body" onclick="blobTap()">
        <div class="blob-eyes" id="blob-eyes">
          <div class="eye" id="eye-l"></div>
          <div class="eye" id="eye-r"></div>
        </div>
      </div>
    </div>

    <div class="blob-label">
      <div class="blob-name">BLOB</div>
      <div class="blob-sub">AGENTE HYPE LAB · v6</div>
      <div class="mood-pill" id="mood-pill">● PRONTO</div>
    </div>

    <div id="chat-layer">
      <div id="messages-wrap"></div>
    </div>
  </div>

  <div id="input-dock">
    <div class="input-row">
      <textarea id="chat-input" rows="1" placeholder="Pergunte sobre nossos planos... 💬" maxlength="400"></textarea>
      <button id="send-btn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <footer>
    <div class="footer-brand">HYPE LAB · COGNITIVE ENGINE 2025</div>
    <button class="reset-btn" onclick="location.reload()">[ RESET ]</button>
  </footer>
</div>

<script>
/* ══════ BACKGROUND PARTICLES ══════ */
const cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d');
let W,H,pts=[];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}resize();addEventListener('resize',resize);
class Pt{constructor(){this.rst()}rst(){this.x=Math.random()*W;this.y=Math.random()*H;
  this.vx=(Math.random()-.5)*.035;this.vy=(Math.random()-.5)*.035;
  this.r=Math.random()*.8+.25;this.a=Math.random()*.07+.01;
  this.life=Math.random()*250+100;this.ml=this.life}
  step(){this.x+=this.vx;this.y+=this.vy;this.life--;
    if(this.life<=0||this.x<0||this.x>W||this.y<0||this.y>H)this.rst()}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,255,136,${this.a*(this.life/this.ml)})`;ctx.fill()}}
for(let i=0;i<40;i++)pts.push(new Pt());
function frame(){ctx.clearRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,H*.5,0,W/2,H*.5,Math.min(W,H)*.55);
  rg.addColorStop(0,'rgba(0,255,136,0.022)');rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){
    const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
    if(d<80){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
      ctx.strokeStyle=`rgba(0,255,136,${.025*(1-d/80)})`;ctx.lineWidth=.4;ctx.stroke()}}}
  pts.forEach(p=>{p.step();p.draw()});requestAnimationFrame(frame)}
frame();

const cg=document.getElementById('cg');
const ec=document.getElementById('blob-eyes');
const eL=document.getElementById('eye-l'),eR=document.getElementById('eye-r');
document.addEventListener('mousemove',e=>{
  cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px';
  const r=ec.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const ang=Math.atan2(e.clientY-cy,e.clientX-cx);
  const d=Math.min(3,Math.hypot(e.clientX-cx,e.clientY-cy)/85);
  ec.style.transform=`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px)`;
});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];const r=ec.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const ang=Math.atan2(t.clientY-cy,t.clientX-cx);
  const d=Math.min(2.5,Math.hypot(t.clientX-cx,t.clientY-cy)/85);
  ec.style.transform=`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px)`;
},{passive:true});

};
function setState(s){
  const m=MOODS[s]||MOODS.idle;
  document.body.className=m.cls;
  document.getElementById('mood-pill').textContent=m.pill;
  document.getElementById('status-txt').textContent=m.status;
  if(s==='happy'||s==='love') setTimeout(()=>setState('idle'),700);

const overlay=document.getElementById('lead-overlay');
let leadShown=false;

function openLead(){
  if(leadShown)return;
  leadShown=true;
  overlay.classList.add('open');
  // fechar ao clicar fora
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeLead()},{once:true});

function closeLead(){
  overlay.classList.remove('open');
  // reagendar para tentar novamente mais tarde se não enviou
  if(!leadSent) setTimeout(()=>{leadShown=false},120000); // 2 min

let leadSent=false;
async function submitLead(){
  const name=document.getElementById('lf-name').value.trim();
  const email=document.getElementById('lf-email').value.trim();
  const phone=document.getElementById('lf-phone').value.trim();
  if(!name||!email){
    document.getElementById('lf-name').style.borderColor='rgba(255,100,100,.5)';

    return;

  const btn=document.getElementById('lead-submit-btn');
  btn.disabled=true;btn.textContent='Enviando...';

  try{

  }catch(e){console.warn('Lead send error:',e)}

  leadSent=true;

function makeMiniBlobHTML(mood='idle'){
  const eyeColor=mood==='alert'?'#ff8800':mood==='love'?'#ff6688':'var(--g1)';
  return `<div class="mini-blob ${mood}"><div class="mini-eyes"><div class="mini-eye" style="background:${eyeColor};box-shadow:0 0 4px ${eyeColor}"></div><div class="mini-eye" style="background:${eyeColor};box-shadow:0 0 4px ${eyeColor}"></div></div></div>`;
}

function appendMsg(type, html, mood='idle', extras){
  const row=document.createElement('div');
  row.className=`msg-row ${type}`;
  if(type==='blob'){
    row.innerHTML=`${makeMiniBlobHTML(mood)}<div><div class="bubble">${html}</div>${extras||''}</div>`;
  } else {
    row.innerHTML=`<div class="bubble">${html}</div>`;
  }
  msgWrap.appendChild(row);
  setTimeout(()=>{
    checkOverflow();
    msgWrap.scrollTop=msgWrap.scrollHeight;
  },50);
  return row;
}

function appendTyping(){
  const row=document.createElement('div');row.className='msg-row blob';row.id='typing-row';
  row.innerHTML=`${makeMiniBlobHTML('thinking')}<div class="typing-bub"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  msgWrap.appendChild(row);
  setTimeout(()=>{checkOverflow();msgWrap.scrollTop=msgWrap.scrollHeight;},50);
}
function removeTyping(){const t=document.getElementById('typing-row');if(t)t.remove()}

function showQuickReplies(qs){
  const div=document.createElement('div');div.className='quick-replies';
  qs.forEach(q=>{const b=document.createElement('button');b.className='qr';b.textContent=q;
    b.onclick=()=>{div.remove();sendMsg(q)};div.appendChild(b)});
  msgWrap.appendChild(div);
  setTimeout(()=>{checkOverflow();msgWrap.scrollTop=msgWrap.scrollHeight;},50);
}

function buildQuickRepliesHTML(qs){
  return `<div class="quick-replies" style="margin-top:6px">${qs.map(q=>`<button class="qr" onclick="sendMsg('${q}')">${q}</button>`).join('')}</div>`;
}

const inp=document.getElementById('chat-input');
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,88)+'px'});

async function sendMsg(preset){
  const text=preset||(inp.value.trim());
  if(!text)return;
  if(!preset){inp.value='';inp.style.height='auto';}

  appendMsg('user',text);
  history.push({role:'user',content:text});
  setState('thinking');
  document.getElementById('send-btn').disabled=true;
  appendTyping();

  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:SYSTEM_PROMPT,messages:history})
    });
    const data=await res.json();
    let reply=data.content?.map(c=>c.text||'').join('')||'Tive um problema! Tenta de novo? 😅';

    let detectedState='idle';
    const stateMatch=reply.match(/\[STATE:(\w+)\]/);
    if(stateMatch){detectedState=stateMatch[1];reply=reply.replace(/\[STATE:\w+\]/g,'').trim()}

    const needsCapture=reply.includes('[CAPTURE_LEAD]');
    reply=reply.replace('[CAPTURE_LEAD]','').trim();

    removeTyping();
    setState(detectedState);
    history.push({role:'assistant',content:reply});

    const fmt=reply
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>')
      .replace(/\n/g,'<br>');

    let qrHTML='';
    const lower=reply.toLowerCase();
    if(lower.includes('express')&&lower.includes('premium')){
      qrHTML=buildQuickRepliesHTML(['Quero Express R$150','Quero Premium R$450','Tirar dúvida'])
    } else if(lower.includes('express')){
      qrHTML=buildQuickRepliesHTML(['Contratar Express','Ver o Premium','Mais detalhes'])
    } else if(lower.includes('premium')){
      qrHTML=buildQuickRepliesHTML(['Contratar Premium','Ver o Express','Falar no WhatsApp'])
    } else if(lower.includes('whatsapp')){
      qrHTML=buildQuickRepliesHTML(['Abrir WhatsApp','Ver planos','Outra dúvida'])
    }

    appendMsg('blob',fmt,detectedState,qrHTML);

    // Abre o pop-up de captura após breve delay
    if(needsCapture) setTimeout(openLead, 600);

  }catch(err){
    removeTyping();setState('alert');
    appendMsg('blob','Ops! Problema de conexão momentâneo 😅 Tenta novamente ou fala direto no <a href="https://wa.me/5511949946730" target="_blank">WhatsApp</a>!','alert');
  }
  document.getElementById('send-btn').disabled=false;
}
